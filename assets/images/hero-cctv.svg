<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="t d">
  <title id="t">Illustration of a CCTV camera and a recorder live view</title>
  <desc id="d">A wall-mounted bullet CCTV camera watching a gate, with a monitor showing four camera views. Generic illustration, not a photograph of an actual installation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103670"/>
      <stop offset="1" stop-color="#071B38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#08B8E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#08B8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08B8E8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#08B8E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D6E6"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16396B"/>
      <stop offset="1" stop-color="#0C254B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020A18" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="600" height="520" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="520" fill="url(#bg)"/>
    <rect width="600" height="520" fill="url(#grid)"/>
    <circle cx="420" cy="150" r="190" fill="url(#glow)"/>

    <!-- Ground scene: gate and boundary wall -->
    <rect x="0" y="420" width="600" height="100" fill="#0A2450"/>
    <rect x="0" y="418" width="600" height="3" fill="#1C4479"/>
    <g fill="#1A3F73">
      <rect x="34" y="300" width="34" height="120" rx="4"/>
      <rect x="222" y="300" width="34" height="120" rx="4"/>
      <rect x="28" y="292" width="46" height="14" rx="4"/>
      <rect x="216" y="292" width="46" height="14" rx="4"/>
    </g>
    <g stroke="#2B5590" stroke-width="5" stroke-linecap="round">
      <path d="M80 330H210M80 400H210"/>
      <path d="M92 326V404M114 326V404M136 326V404M158 326V404M180 326V404M202 326V404"/>
    </g>
    <circle cx="300" cy="352" r="34" fill="#12325F"/>
    <rect x="296" y="372" width="8" height="48" rx="3" fill="#12325F"/>

    <!-- Field of view -->
    <polygon points="352,182 20,330 230,470" fill="url(#cone)"/>

    <!-- Bullet camera -->
    <rect x="546" y="-10" width="14" height="132" rx="7" fill="#9FB2CB"/>
    <g transform="translate(352 168) rotate(16)">
      <path d="M150 -26 L178 -86" stroke="#B8C7DA" stroke-width="16" stroke-linecap="round"/>
      <rect x="150" y="-112" width="64" height="30" rx="8" fill="#E5ECF5"/>
      <rect x="-14" y="-52" width="196" height="22" rx="11" fill="#E9EFF7"/>
      <rect x="0" y="-38" width="176" height="76" rx="34" fill="url(#body)"/>
      <ellipse cx="10" cy="0" rx="24" ry="38" fill="#B5C4D8"/>
      <ellipse cx="6" cy="0" rx="18" ry="31" fill="#0B1B36"/>
      <ellipse cx="6" cy="0" rx="11" ry="19" fill="#050E1F" stroke="#1F4579" stroke-width="3"/>
      <ellipse cx="6" cy="0" rx="5" ry="8" fill="#08B8E8"/>
      <ellipse cx="3" cy="-6" rx="2.2" ry="3.4" fill="#FFFFFF" fill-opacity="0.9"/>
      <circle cx="150" cy="-8" r="4.5" fill="#08B8E8"/>
      <rect x="60" y="16" width="70" height="4" rx="2" fill="#AFC0D5"/>
    </g>

    <!-- Live view monitor -->
    <g filter="url(#shadow)">
      <rect x="292" y="268" width="282" height="214" rx="20" fill="#F4F8FC"/>
    </g>
    <rect x="306" y="282" width="254" height="160" rx="10" fill="#071B38"/>

    <g>
      <!-- Tile 1: gate -->
      <rect x="312" y="288" width="119" height="71" rx="6" fill="url(#tile)"/>
      <rect x="312" y="342" width="119" height="17" fill="#0A2148"/>
      <g stroke="#3A68A6" stroke-width="3" stroke-linecap="round">
        <path d="M330 318V345M342 318V345M354 318V345M366 318V345M378 318V345M390 318V345M402 318V345"/>
        <path d="M326 322H408"/>
      </g>
      <!-- Tile 2: shop shelves -->
      <rect x="435" y="288" width="119" height="71" rx="6" fill="url(#tile)"/>
      <g fill="#2E5B97">
        <rect x="449" y="306" width="54" height="6" rx="2"/>
        <rect x="449" y="324" width="54" height="6" rx="2"/>
        <rect x="449" y="342" width="54" height="6" rx="2"/>
        <rect x="514" y="304" width="28" height="44" rx="3"/>
      </g>
      <g fill="#08B8E8" fill-opacity="0.55">
        <rect x="453" y="298" width="9" height="8" rx="1"/>
        <rect x="467" y="300" width="7" height="6" rx="1"/>
        <rect x="478" y="316" width="10" height="8" rx="1"/>
        <rect x="455" y="334" width="8" height="8" rx="1"/>
      </g>
      <!-- Tile 3: parking -->
      <rect x="312" y="365" width="119" height="71" rx="6" fill="url(#tile)"/>
      <rect x="312" y="418" width="119" height="18" fill="#0A2148"/>
      <path d="M338 412 L346 396 Q349 391 355 391 H388 Q394 391 397 396 L405 412 Z" fill="#2E5B97"/>
      <rect x="332" y="408" width="80" height="14" rx="5" fill="#3A68A6"/>
      <circle cx="348" cy="424" r="6" fill="#071B38"/>
      <circle cx="396" cy="424" r="6" fill="#071B38"/>
      <!-- Tile 4: entrance door -->
      <rect x="435" y="365" width="119" height="71" rx="6" fill="url(#tile)"/>
      <rect x="474" y="377" width="40" height="55" rx="3" fill="#2E5B97"/>
      <circle cx="506" cy="406" r="2.6" fill="#08B8E8"/>
      <rect x="466" y="430" width="56" height="6" rx="2" fill="#3A68A6"/>

      <!-- Tile labels -->
      <g font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" fill-opacity="0.75" letter-spacing="0.5">
        <text x="319" y="300">CAM 1</text>
        <text x="442" y="300">CAM 2</text>
        <text x="319" y="377">CAM 3</text>
        <text x="442" y="377">CAM 4</text>
      </g>
      <g fill="#08B8E8">
        <circle cx="423" cy="296" r="3"/>
        <circle cx="546" cy="296" r="3"/>
        <circle cx="423" cy="373" r="3"/>
        <circle cx="546" cy="373" r="3"/>
      </g>
    </g>

    <!-- Monitor footer -->
    <circle cx="318" cy="462" r="6" fill="#E5484D"/>
    <text x="331" y="466" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0A2854" letter-spacing="1">REC</text>
    <rect x="388" y="457" width="92" height="9" rx="4.5" fill="#E3EBF4"/>
    <rect x="388" y="457" width="58" height="9" rx="4.5" fill="#08B8E8"/>
    <rect x="500" y="455" width="48" height="13" rx="6.5" fill="#0A2854"/>
  </g>
</svg>
