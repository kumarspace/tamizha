<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">Illustration of a house with a CCTV camera covering the gate and front door</title>
  <rect width="480" height="300" fill="#EAF4FB"/>
  <circle cx="390" cy="70" r="90" fill="#DCEEF9"/>
  <rect y="246" width="480" height="54" fill="#D3E3F2"/>
  <!-- House -->
  <rect x="200" y="132" width="190" height="114" fill="#FFFFFF"/>
  <polygon points="186,138 295,66 404,138" fill="#0A2854"/>
  <rect x="270" y="176" width="44" height="70" rx="3" fill="#123D70"/>
  <circle cx="304" cy="212" r="3" fill="#08B8E8"/>
  <rect x="220" y="160" width="36" height="34" rx="3" fill="#BFE9F8" stroke="#0A2854" stroke-width="3"/>
  <rect x="332" y="160" width="40" height="34" rx="3" fill="#BFE9F8" stroke="#0A2854" stroke-width="3"/>
  <path d="M238 160V194M352 160V194" stroke="#0A2854" stroke-width="2"/>
  <!-- Gate -->
  <rect x="72" y="186" width="18" height="60" rx="2" fill="#123D70"/>
  <rect x="166" y="186" width="18" height="60" rx="2" fill="#123D70"/>
  <g stroke="#123D70" stroke-width="4" stroke-linecap="round">
    <path d="M96 202H160M96 236H160"/>
    <path d="M104 198V240M118 198V240M132 198V240M146 198V240"/>
  </g>
  <!-- Field of view -->
  <polygon points="356,152 80,246 232,246" fill="#08B8E8" fill-opacity="0.2"/>
  <!-- Camera -->
  <g transform="translate(356 150) rotate(-22)">
    <rect x="-4" y="-6" width="40" height="16" rx="8" fill="#FFFFFF" stroke="#0A2854" stroke-width="3"/>
    <circle cx="2" cy="2" r="5" fill="#0A2854"/>
    <circle cx="2" cy="2" r="2" fill="#08B8E8"/>
    <path d="M28 -6 L36 -18" stroke="#0A2854" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Plants -->
  <circle cx="420" cy="226" r="20" fill="#7FD3EE"/>
  <circle cx="440" cy="234" r="14" fill="#08B8E8" fill-opacity="0.6"/>
</svg>
