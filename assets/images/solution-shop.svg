<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">Illustration of a retail shop front with a CCTV camera above the entrance</title>
  <rect width="480" height="300" fill="#EAF4FB"/>
  <circle cx="80" cy="60" r="80" fill="#DCEEF9"/>
  <rect y="250" width="480" height="50" fill="#D3E3F2"/>
  <!-- Building -->
  <rect x="90" y="70" width="300" height="180" fill="#FFFFFF"/>
  <rect x="140" y="82" width="200" height="30" rx="4" fill="#0A2854"/>
  <rect x="160" y="94" width="96" height="6" rx="3" fill="#08B8E8"/>
  <rect x="264" y="94" width="56" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.6"/>
  <!-- Awning -->
  <g>
    <path d="M98 122h24v26a12 12 0 0 1 -24 0z" fill="#0A2854"/>
    <path d="M122 122h24v26a12 12 0 0 1 -24 0z" fill="#FFFFFF"/>
    <path d="M146 122h24v26a12 12 0 0 1 -24 0z" fill="#0A2854"/>
    <path d="M170 122h24v26a12 12 0 0 1 -24 0z" fill="#FFFFFF"/>
    <path d="M194 122h24v26a12 12 0 0 1 -24 0z" fill="#0A2854"/>
    <path d="M218 122h24v26a12 12 0 0 1 -24 0z" fill="#FFFFFF"/>
    <path d="M242 122h24v26a12 12 0 0 1 -24 0z" fill="#0A2854"/>
    <path d="M266 122h24v26a12 12 0 0 1 -24 0z" fill="#FFFFFF"/>
    <path d="M290 122h24v26a12 12 0 0 1 -24 0z" fill="#0A2854"/>
    <path d="M314 122h24v26a12 12 0 0 1 -24 0z" fill="#FFFFFF"/>
    <path d="M338 122h24v26a12 12 0 0 1 -24 0z" fill="#0A2854"/>
    <path d="M362 122h24v26a12 12 0 0 1 -24 0z" fill="#FFFFFF"/>
    <rect x="98" y="118" width="288" height="6" rx="2" fill="#0A2854"/>
  </g>
  <!-- Window with shelves -->
  <rect x="112" y="170" width="148" height="80" rx="3" fill="#BFE9F8" stroke="#0A2854" stroke-width="3"/>
  <g fill="#123D70">
    <rect x="122" y="196" width="128" height="4" rx="2"/>
    <rect x="122" y="224" width="128" height="4" rx="2"/>
  </g>
  <g fill="#08B8E8">
    <rect x="128" y="182" width="14" height="14" rx="2"/>
    <rect x="150" y="186" width="10" height="10" rx="2"/>
    <rect x="200" y="180" width="18" height="16" rx="2"/>
    <rect x="140" y="210" width="16" height="14" rx="2"/>
    <rect x="226" y="208" width="12" height="16" rx="2"/>
  </g>
  <!-- Door -->
  <rect x="284" y="170" width="76" height="80" rx="3" fill="#123D70"/>
  <rect x="294" y="180" width="56" height="44" rx="2" fill="#BFE9F8" fill-opacity="0.5"/>
  <!-- Field of view -->
  <polygon points="358,172 236,250 384,250" fill="#08B8E8" fill-opacity="0.2"/>
  <!-- Camera -->
  <g transform="translate(358 170) rotate(-30)">
    <rect x="-4" y="-6" width="40" height="16" rx="8" fill="#FFFFFF" stroke="#0A2854" stroke-width="3"/>
    <circle cx="2" cy="2" r="5" fill="#0A2854"/>
    <circle cx="2" cy="2" r="2" fill="#08B8E8"/>
    <path d="M28 -6 L36 -18" stroke="#0A2854" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
